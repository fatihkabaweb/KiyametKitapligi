name: Test ve yayınla

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: İçeriği doğrula
        run: node tools/check.mjs
      - name: Testler
        run: node --test tools/test.mjs
      - name: Derle
        run: node tools/build.mjs
      - name: Derlenmiş dosyalar güncel mi?
        run: |
          if ! git diff --quiet -- app; then
            echo "::error::app/ klasörü güncel değil. Yerelde 'node tools/build.mjs' çalıştırıp sonucu commit edin."
            git diff --stat -- app
            exit 1
          fi
      - name: Siteyi hazırla
        run: |
          mkdir -p _site
          cp -r app/. _site/
          cp dist/*.html _site/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
